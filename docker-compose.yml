services:
  db:
    image: postgres:17-alpine
    container_name: tripstack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tripstack
      POSTGRES_PASSWORD: tripstack
      POSTGRES_DB: tripstack
    ports:
      - "5432:5432"
    volumes:
      - tripstack-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripstack -d tripstack"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tripstack-db:
